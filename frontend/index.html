</div><script>

    // ==========================================
    // BACKEND URL + TOKEN
    // ==========================================

    const API_URL = "https://memoryvaultai.onrender.com";
    let TOKEN = localStorage.getItem("token");
    function showUserEmail() {

    const userEmail = document.getElementById("userEmail");
    const email = localStorage.getItem("email");

    if (email) {
        userEmail.innerHTML =
            "👤 " + escapeHTML(email);
    } else {
        userEmail.innerHTML =
            "👤 Not logged in";
    }
}
    function checkLogin() {

    const loginStatus =
        document.getElementById("loginStatus");

    const token =
        localStorage.getItem("token");

    if (token) {

        loginStatus.innerHTML =
            '<div class="message success">✅ You are logged in.</div>';

    } else {

        loginStatus.innerHTML =
            '<div class="message error">❌ You are not logged in.</div>';
    }

    closeMenu();
}


function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("email");
    localStorage.removeItem("user_id");

    alert("✅ Logged out successfully!");

    window.location.reload();
}


    // ==========================================
    // CHECK TOKEN
    // ==========================================

    function checkToken() {

        if (!TOKEN) {

            console.error("Token not found in localStorage");

            return false;
        }

        return true;
    }


    // ==========================================
    // CHECK BACKEND
    // ==========================================

    async function checkBackend() {

        const status =
            document.getElementById("status");

        try {

            const response =
                await fetch(API_URL + "/");

            const data =
                await response.json();

            if (response.ok) {

                if (data.gemini_api_loaded) {

                    status.innerHTML =
                        "🟢 Backend Connected 🚀 | Gemini Connected 🤖";

                } else {

                    status.innerHTML =
                        "🟢 Backend Connected 🚀 | Gemini Not Connected ⚠️";
                }

            } else {

                status.innerHTML =
                    "🔴 Backend Error ❌";
            }

        } catch (error) {

            status.innerHTML =
                "🔴 Backend Connection Failed ❌";

            console.error(error);
        }
    }


    // ==========================================
// ADD MEMORY
// ==========================================
 
async function addMemory() {

    if (!TOKEN) {
        document.getElementById("saveMessage").innerHTML =
            '<div class="message error">❌ Please login first to save a memory.</div>';
        return;
    }

    const title = document.getElementById("title").value.trim();
    const content = document.getElementById("content").value.trim();
    const message = document.getElementById("saveMessage");

    if (title.length < 3) {
        message.innerHTML =
            '<div class="message error">❌ Title must contain at least 3 characters.</div>';
        return;
    }

    if (content.length < 5) {
        message.innerHTML =
            '<div class="message error">❌ Memory must contain at least 5 characters.</div>';
        return;
    }

    try {
        const response = await fetch(API_URL + "/memory", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + TOKEN
    },
    body: JSON.stringify({
        user_id: parseInt(localStorage.getItem("user_id")),
        title: title,
        content: content,
        favorite: 0
    })
});

        const data = await response.json();

        if (data.status === "success") {

            message.innerHTML =
                '<div class="message success">✅ Memory saved successfully!</div>';

            document.getElementById("title").value = "";
            document.getElementById("content").value = "";

            getMemories();

        } else {

            message.innerHTML =
                '<div class="message error">❌ ' +
                (data.message || "Memory save failed") +
                '</div>';
        }

    } catch (error) {

        message.innerHTML =
            '<div class="message error">❌ Backend connection failed.</div>';

        console.error(error);
    }
}

   

    // ==========================================
    // DELETE MEMORY
    // ==========================================

    async function deleteMemory(id) {

        const confirmDelete =
            confirm(
                "Are you sure you want to delete this memory?"
            );


        if (!confirmDelete) {

            return;
        }


        if (!checkToken()) {

            alert("❌ Login token not found.");

            return;
        }


        try {

            const response =
                await fetch(
                    API_URL +
                    "/memory/" +
                    id +
                    "?token=" +
                    encodeURIComponent(TOKEN),
                    {

                        method: "DELETE"

                    }
                );


            const data =
                await response.json();


            if (data.status === "success") {

                alert(
                    "✅ Memory deleted successfully!"
                );

                getMemories();

            } else {

                alert(
                    "❌ " +
                    (data.message || "Delete failed")
                );
            }


        } catch (error) {

            alert(
                "❌ Backend connection failed."
            );

            console.error(error);
        }
    }


    // ==========================================
    // SEARCH MEMORIES
    // ==========================================

    async function searchMemories() {

        const keyword =
            document
                .getElementById("searchKeyword")
                .value
                .trim();

        const results =
            document.getElementById("searchResults");


        if (!keyword) {

            results.innerHTML =
                '<div class="message error">❌ Enter a search keyword.</div>';

            return;
        }


        if (!checkToken()) {

            results.innerHTML =
                '<div class="message error">❌ Login token not found.</div>';

            return;
        }


        results.innerHTML =
            '<div class="message">⏳ Searching...</div>';


        try {

            const response =
                await fetch(
                    API_URL +
                    "/search?keyword=" +
                    encodeURIComponent(keyword) +
                    "&token=" + encodeURIComponent(TOKEN)
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message || "Search failed"
                );
            }


            if (
                !data.memories ||
                data.memories.length === 0
            ) {

                results.innerHTML =
                    '<div class="message">📭 No matching memories found.</div>';

                return;
            }


            results.innerHTML = "";


            data.memories.forEach(function(memory) {

                const title = memory[2];

                const content = memory[3];

                const createdAt = memory[4];


                results.innerHTML += `

                    <div class="memory">

                        <h3>
                            🧠 ${escapeHTML(title)}
                        </h3>

                        <p>
                            ${escapeHTML(content)}
                        </p>

                        <p class="date">
                            📅 ${escapeHTML(createdAt)}
                        </p>

                    </div>

                `;

            });


        } catch (error) {

            results.innerHTML =
                '<div class="message error">❌ Search failed.</div>';

            console.error(error);
        }
    }


    // ==========================================
    // ASK AI
    // ==========================================

    async function askAI() {

        const question =
            document
                .getElementById("question")
                .value
                .trim();

        const result =
            document.getElementById("result");


        if (question.length < 2) {

            result.innerHTML =
                "❌ Please enter a question.";

            return;
        }


        if (!checkToken()) {

            result.innerHTML =
                "❌ Login token not found.";

            return;
        }


        result.innerHTML =
            "🤖 AI is thinking...";


        try {

            const response =
                await fetch(
                    API_URL +
                    "/ask-ai?token=" +
                    encodeURIComponent(TOKEN),
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            question: question

                        })

                    }
                );


            const data =
                await response.json();
            console.log("ASK AI DATA:",data);


            if (data.status !== "success") {

                result.innerHTML =
                    "❌ " +
                    (data.message ||
                     "AI request failed.");

                return;
            }


            result.innerHTML = `

                <strong>🤖 AI Answer:</strong>

                <br><br>

                ${escapeHTML(data.answer)}

            `;


        } catch (error) {

            result.innerHTML =
                "❌ Backend connection failed.";

            console.error(error);
        }
    }


    // ==========================================
    // SECURITY HELPER
    // ==========================================

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
    async function getMemories() {

    const memoriesDiv = document.getElementById("memories");

    memoriesDiv.innerHTML =
        '<div class="message">⏳ Loading memories...</div>';

    try {

        const response = await fetch(
            API_URL + "/memories?token=" + encodeURIComponent(TOKEN));

        const data = await response.json();

        console.log("MEMORIES DATA:", data);

        if (!response.ok) {
            throw new Error(data.message || "Failed to load memories");
        }

        if (!data.memories || data.memories.length === 0) {
            memoriesDiv.innerHTML =
                '<div class="message">📭 No memories saved yet.</div>';
            return;
        }

        memoriesDiv.innerHTML = "";

        data.memories.forEach(function(memory) {

            const id = memory[0];
            const title = memory[2];
            const content = memory[3];
            const createdAt = memory[4];
            const favorite = memory[5];

            memoriesDiv.innerHTML += `
                <div class="memory">
                    <h3>🧠 ${escapeHTML(title)}</h3>
                    <p>${escapeHTML(content)}</p>
                    <p class="date">📅 ${escapeHTML(createdAt)}</p>
                    <p class="favorite">
                        ⭐ Favorite: ${favorite == 1 ? "Yes" : "No"}
                    </p>
                    <button onclick="editMemory(${id})">
    ✏️ Edit
</button>

<button onclick="toggleFavorite(${id}, ${favorite})">
    ⭐ ${favorite == 1 ? "Unfavorite" : "Favorite"}
</button>

<button class="danger" onclick="deleteMemory(${id})">
    🗑️ Delete
</button>
                </div>
            `;
        });

    } catch (error) {

        memoriesDiv.innerHTML =
            '<div class="message error">❌ Could not load memories.</div>';

        console.error("GET MEMORIES ERROR:", error);
    }
}
async function toggleFavorite(id, currentFavorite) {

    const newFavorite = currentFavorite == 1 ? 0 : 1;

    try {

        // Get existing memories
        const memoriesResponse = await fetch(
            API_URL + "/memories?token=" +
            encodeURIComponent(TOKEN)
        );

        const memoriesData = await memoriesResponse.json();

        if (!memoriesResponse.ok) {
            throw new Error("Could not load memory");
        }

        // Find the selected memory
        const selectedMemory = memoriesData.memories.find(
            memory => memory[0] == id
        );

        if (!selectedMemory) {
            alert("❌ Memory not found");
            return;
        }

        const response = await fetch(
            API_URL + "/memory/" + id + "?token=" + encodeURIComponent(TOKEN),
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id: parseInt(localStorage.getItem("user_id")),
                    title: selectedMemory[2],
                    content: selectedMemory[3],
                    favorite: newFavorite
                })
            }
        );

        const data = await response.json();

        if (data.status === "success") {

            getMemories();
            getFavorites();

        } else {

            alert(
                "❌ " +
                (data.message || "Favorite update failed")
            );
        }

    } catch (error) {

        alert("❌ Favorite update failed");
        console.error(error);
    }
}
async function getFavorites() {

    const favoritesDiv = document.getElementById("favorites");

    favoritesDiv.innerHTML =
        '<div class="message">⏳ Loading favorites...</div>';

    try {

        const response = await fetch(
            API_URL + "/favorites?token=" +
            encodeURIComponent(TOKEN)
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error("Failed to load favorites");
        }

        if (!data.favorites || data.favorites.length === 0) {
            favoritesDiv.innerHTML =
                '<div class="message">📭 No favorite memories.</div>';
            return;
        }

        favoritesDiv.innerHTML = "";

        data.favorites.forEach(function(memory) {

            const title = memory[2];
            const content = memory[3];
            const createdAt = memory[4];

            favoritesDiv.innerHTML += `
                <div class="memory">
                    <h3>⭐ ${escapeHTML(title)}</h3>
                    <p>${escapeHTML(content)}</p>
                    <p class="date">📅 ${escapeHTML(createdAt)}</p>
                </div>
            `;
        });

    } catch (error) {

        favoritesDiv.innerHTML =
            '<div class="message error">❌ Could not load favorites.</div>';

        console.error(error);
    }
}

async function editMemory(id) {

    const newTitle = prompt("Enter new title:");
    if (newTitle === null) return;

    const newContent = prompt("Enter new content:");
    if (newContent === null) return;

    try {

        const response = await fetch(
            API_URL + "/memory/" + id + "?token="+ encodeURIComponent(TOKEN),
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    user_id:parseInt(localStorage.getItem("user_id")),
                    title: newTitle,
                    content: newContent,
                    favorite: 0
                })
            }
        );

        const data = await response.json();

        if (data.status === "success") {
            alert("✅ Memory updated successfully!");
            getMemories();
        } else {
            alert("❌ " + (data.message || "Update failed"));
        }

    } catch (error) {
        alert("❌ Memory update failed.");
        console.error(error);
    }
}

async function getDashboard() {

    const dashboard = document.getElementById("dashboard");

    dashboard.innerHTML =
        '<div class="message">⏳ Loading dashboard...</div>';

    try {

        const response = await fetch(
            API_URL + "/dashboard?token=" +
            encodeURIComponent(TOKEN)
        );

        const data = await response.json();

        if (!response.ok || data.status === "failed") {
            throw new Error(data.message || "Dashboard failed");
        }

        dashboard.innerHTML = `
            <div class="memory">
                <h3>📊 Dashboard</h3>
                <p>🧠 Total Memories: ${data.dashboard.total_memories}</p>
                <p>⭐ Favorite Memories: ${data.dashboard.favorite_memories}</p>
            </div>
        `;

    } catch (error) {

        dashboard.innerHTML =
            '<div class="message error">❌ Could not load dashboard.</div>';

        console.error("DASHBOARD ERROR:", error);
    }
}

async function loginUser() {

    const email = document.getElementById("loginEmail").value.trim();
    console.log("LOGIN EMAIL:",email);
    const password = document.getElementById("loginPassword").value;
    const message = document.getElementById("authMessage");

    if (!email || !password) {
        message.innerHTML = "❌ Enter email and password.";
        return;
    }

    try {

        const response = await fetch(API_URL + "/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (data.status === "success") {

            localStorage.setItem("token", data.access_token);
            TOKEN=data.access_token;
            localStorage.setItem("email", data.email);
            localStorage.setItem("user_id",data.user_id);

            message.innerHTML =
                "✅ Login successful!";

            location.reload();

        } else {

            message.innerHTML =
                "❌ " + (data.message || "Login failed");
        }

    } catch (error) {

        message.innerHTML =
            "❌ Backend connection failed.";

        console.error(error);
    }
}
